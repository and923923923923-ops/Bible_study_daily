<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>聖言研讀 · 和合本</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #f2ecdf; font-family: system-ui, 'Segoe UI', 'Noto Sans CJK TC', sans-serif; color: #2e2a24; padding: 12px 12px 90px 12px; }
        .app { max-width: 700px; margin: 0 auto; }
        .toolbar { background: #fffaf2; border-radius: 32px; box-shadow: 0 8px 18px rgba(0,0,0,0.08); padding: 12px 16px; margin-bottom: 16px; border: 1px solid #e7d8c4; }
        .row-selectors { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .selector-group { background: #f5ede2; border-radius: 40px; padding: 4px 12px; display: flex; align-items: center; gap: 8px; }
        .selector-group i { color: #a88762; }
        select { background: transparent; border: none; font-size: 0.9rem; font-weight: 500; color: #4e3e2c; padding: 8px 4px; outline: none; }
        .chapter-scroll { margin-top: 12px; overflow-x: auto; white-space: nowrap; padding-bottom: 6px; }
        .chapter-list { display: inline-flex; gap: 8px; }
        .chap { background: #faf3e9; border-radius: 40px; padding: 6px 14px; font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: 0.1s; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .chap.active { background: #b69060; color: white; }
        .version-card { background: #fffdf9; border-radius: 36px; box-shadow: 0 12px 24px rgba(0,0,0,0.08); margin-bottom: 20px; padding: 16px 18px; border: 1px solid #ecdfcf; }
        .version-title { font-size: 1.35rem; font-weight: 700; color: #735e44; border-left: 5px solid #c7a16b; padding-left: 12px; margin-bottom: 12px; }
        .verse-item { display: flex; align-items: baseline; padding: 6px 0; border-bottom: 1px solid #f2e6da; }
        .verse-number { width: 32px; background: #f4ede3; border-radius: 30px; text-align: center; font-size: 0.7rem; margin-right: 12px; cursor: pointer; flex-shrink: 0; }
        .verse-text { flex: 1; line-height: 1.5; }
        .strong { background: #e7dbcd; border-radius: 30px; padding: 2px 8px; font-size: 0.68rem; font-weight: 600; color: #6f543a; cursor: pointer; display: inline-block; margin: 0 2px; }
        .fab-container { position: fixed; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 14px; z-index: 100; flex-wrap: wrap; }
        .fab { background: #fef7ed; backdrop-filter: blur(12px); border-radius: 60px; padding: 10px 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); border: none; font-weight: 600; display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #735e44; cursor: pointer; }
        .fab:active { transform: scale(0.96); }
        .drawer { position: fixed; bottom: 0; left: 0; right: 0; background: #fffbf2; border-radius: 32px 32px 0 0; transition: transform 0.3s ease; transform: translateY(100%); z-index: 200; max-height: 70vh; overflow-y: auto; border-top: 1px solid #eedfcb; }
        .drawer.open { transform: translateY(0); }
        .drawer-header { padding: 18px 20px 10px; display: flex; justify-content: space-between; font-weight: 700; font-size: 1.2rem; border-bottom: 1px solid #e9dbc9; }
        .close-drawer { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #b69060; }
        .drawer-content { padding: 18px 20px 30px; }
        textarea { width: 100%; padding: 12px; border-radius: 24px; border: 1px solid #e3d2be; background: #fffcf7; margin: 12px 0; }
        .small-btn { background: #dfcfba; border: none; border-radius: 40px; padding: 8px 16px; font-weight: 500; cursor: pointer; margin-right: 8px; }
        .search-panel { background: #fff7ef; border-radius: 28px; margin-bottom: 16px; padding: 12px; display: none; }
        .search-panel.open { display: block; }
        .search-input { width: 100%; padding: 12px 16px; border-radius: 40px; border: 1px solid #ddcfbb; background: white; }
        .progress-tag { background: #e7dfd1; border-radius: 24px; padding: 4px 12px; font-size: 0.7rem; display: inline-block; color: #7e684e; }
        .ai-conversation { max-height: 280px; overflow-y: auto; background: #faf5ec; border-radius: 24px; padding: 12px; margin-bottom: 12px; }
        .ai-question { background: #e7ddcf; border-radius: 20px; padding: 8px 12px; margin: 6px 0; }
        .ai-answer { background: #fff3e4; border-radius: 20px; padding: 8px 12px; margin: 6px 0; }
        .error-msg { color: #b00020; background: #ffe6e6; padding: 12px; border-radius: 24px; text-align: center; }
        .selected-verse-highlight { background-color: #fff0e0; border-radius: 20px; padding: 4px 8px; margin: 0 -8px; }
    </style>
</head>
<body>
<div class="app">
    <div class="toolbar">
        <div class="row-selectors">
            <div class="selector-group"><i class="fas fa-scroll"></i><select id="bookSelect"></select></div>
            <div class="selector-group"><i class="fas fa-hashtag"></i><select id="chapterSelect"></select></div>
            <div class="progress-tag" id="progressLabel">讀經中</div>
        </div>
        <div class="chapter-scroll" id="chapterScroll"></div>
    </div>

    <div class="version-card">
        <div class="version-title"><i class="fas fa-bible"></i> 和合本 (CUV)</div>
        <div id="versesContainer">載入中...</div>
    </div>

    <div id="searchPanel" class="search-panel">
        <input type="text" id="keywordInput" class="search-input" placeholder="🔍 搜尋整本聖經關鍵字">
        <div id="searchResult" style="font-size:0.8rem; margin-top:8px;"></div>
    </div>

    <div class="fab-container">
        <button class="fab" id="openSearchBtn"><i class="fas fa-search"></i> 搜尋</button>
        <button class="fab" id="openNoteBtn"><i class="fas fa-pen-fancy"></i> 筆記</button>
        <button class="fab" id="openAiBtn"><i class="fas fa-robot"></i> AI 助理</button>
    </div>

    <div id="noteDrawer" class="drawer">
        <div class="drawer-header"><span><i class="fas fa-paste"></i> 靈修筆記 · 書籤</span><button class="close-drawer" data-drawer="note">✕</button></div>
        <div class="drawer-content">
            <div><strong>目前經節：</strong> <span id="currentVerseRef">未選取</span></div>
            <textarea id="noteContent" rows="3" placeholder="寫下你的筆記..."></textarea>
            <button id="saveNote" class="small-btn"><i class="fas fa-save"></i> 儲存</button>
            <button id="addBookmark" class="small-btn"><i class="fas fa-bookmark"></i> 書籤</button>
            <hr>
            <div><strong>📌 我的書籤</strong></div>
            <div id="bookmarkList"></div>
            <hr>
            <div><strong>📖 閱讀進度</strong></div>
            <div id="progressDetail"></div>
        </div>
    </div>

    <div id="aiDrawer" class="drawer">
        <div class="drawer-header"><span><i class="fas fa-microchip"></i> DeepSeek AI 助理</span><button class="close-drawer" data-drawer="ai">✕</button></div>
        <div class="drawer-content">
            <div class="ai-conversation" id="aiChatLog"><div class="ai-msg">🤖 可問任何聖經問題</div></div>
            <input type="password" id="apiKeyInput" placeholder="DeepSeek API Key (選填)" style="width:100%; padding:8px; border-radius:40px; margin-bottom:8px;">
            <button id="saveApiKey" class="small-btn">儲存 Key</button>
            <textarea id="aiQuestion" rows="2" placeholder="例如：什麼是『恩典』？"></textarea>
            <button id="askAiBtn" class="small-btn"><i class="fas fa-paper-plane"></i> 發問</button>
        </div>
    </div>
</div>

<script src="bibleText.js"></script>
<script>
    // ========== 解析聖經資料（根據實際 bibleText.js 格式） ==========
    let booksList = [];
    let chaptersMap = {};
    let versesData = {};
    let fullBibleArray = [];

    function getFullBookName(shortName) {
        const map = {
            "創":"創世記","出":"出埃及記","利":"利未記","民":"民數記","申":"申命記",
            "書":"約書亞記","士":"士師記","路":"路得記","撒上":"撒母耳記上","撒下":"撒母耳記下",
            "王上":"列王紀上","王下":"列王紀下","代上":"歷代志上","代下":"歷代志下",
            "拉":"以斯拉記","尼":"尼希米記","斯":"以斯帖記","伯":"約伯記",
            "詩":"詩篇","箴":"箴言","傳":"傳道書","歌":"雅歌",
            "賽":"以賽亞書","耶":"耶利米書","哀":"耶利米哀歌","結":"以西結書","但":"但以理書",
            "何":"何西阿書","珥":"約珥書","摩":"阿摩司書","俄":"俄巴底亞書","拿":"約拿書",
            "彌":"彌迦書","鴻":"那鴻書","哈":"哈巴谷書","番":"西番雅書","該":"哈該書",
            "亞":"撒迦利亞書","瑪":"瑪拉基書",
            "太":"馬太福音","可":"馬可福音","路":"路加福音","約":"約翰福音",
            "徒":"使徒行傳","羅":"羅馬書","林前":"哥林多前書","林後":"哥林多後書",
            "加":"加拉太書","弗":"以弗所書","腓":"腓立比書","西":"歌羅西書",
            "帖前":"帖撒羅尼迦前書","帖後":"帖撒羅尼迦後書",
            "提前":"提摩太前書","提後":"提摩太後書",
            "提多":"提多書",
            "門":"腓利門書","來":"希伯來書","雅":"雅各書",
            "彼前":"彼得前書","彼後":"彼得後書",
            "約壹":"約翰一書","約貳":"約翰二書","約參":"約翰三書",
            "猶":"猶大書","啟":"啟示錄"
        };
        return map[shortName] || null;
    }

    function parseBibleText() {
        if (typeof bibleText === 'undefined') {
            document.getElementById("versesContainer").innerHTML = '<div class="error-msg">❌ 無法載入 bibleText.js，請確認檔案存在。</div>';
            return false;
        }
        if (!Array.isArray(bibleText)) {
            document.getElementById("versesContainer").innerHTML = '<div class="error-msg">❌ bibleText 不是陣列，請確認檔案格式正確。</div>';
            return false;
        }

        fullBibleArray = bibleText;
        const bookSet = new Set();
        const tempChapters = {};

        for (let i = 0; i < fullBibleArray.length; i++) {
            const line = fullBibleArray[i];
            if (!line || line.trim() === '') continue;

            const firstSpace = line.indexOf(' ');
            if (firstSpace === -1) continue;

            const ref = line.substring(0, firstSpace);
            const text = line.substring(firstSpace + 1);

            const match = ref.match(/^([^\d]+)(\d+):(\d+)$/);
            if (!match) continue;

            const shortBook = match[1].trim();
            const chapter = parseInt(match[2]);
            const verse = parseInt(match[3]);

            if (isNaN(chapter) || isNaN(verse)) continue;

            const fullBook = getFullBookName(shortBook);
            if (!fullBook) continue;

            bookSet.add(fullBook);
            const key = `${fullBook}_${chapter}`;
            if (!versesData[key]) versesData[key] = {};
            versesData[key][verse] = text;

            if (!tempChapters[fullBook] || tempChapters[fullBook] < chapter) {
                tempChapters[fullBook] = chapter;
            }
        }

        booksList = Array.from(bookSet);
        const order = ["創世記","出埃及記","利未記","民數記","申命記","約書亞記","士師記","路得記","撒母耳記上","撒母耳記下","列王紀上","列王紀下","歷代志上","歷代志下","以斯拉記","尼希米記","以斯帖記","約伯記","詩篇","箴言","傳道書","雅歌","以賽亞書","耶利米書","耶利米哀歌","以西結書","但以理書","何西阿書","約珥書","阿摩司書","俄巴底亞書","約拿書","彌迦書","那鴻書","哈巴谷書","西番雅書","哈該書","撒迦利亞書","瑪拉基書","馬太福音","馬可福音","路加福音","約翰福音","使徒行傳","羅馬書","哥林多前書","哥林多後書","加拉太書","以弗所書","腓立比書","歌羅西書","帖撒羅尼迦前書","帖撒羅尼迦後書","提摩太前書","提摩太後書","提多書","腓利門書","希伯來書","雅各書","彼得前書","彼得後書","約翰一書","約翰二書","約翰三書","猶大書","啟示錄"];
        booksList.sort((a, b) => order.indexOf(a) - order.indexOf(b));

        for (let b of booksList) {
            chaptersMap[b] = tempChapters[b] || 1;
        }

        return true;
    }

    // ========== 全域變數 ==========
    let currentBook = "創世記";
    let currentChapter = 1;
    let currentVerse = 1;
    let notes = JSON.parse(localStorage.getItem("bible_notes") || "{}");
    let bookmarks = JSON.parse(localStorage.getItem("bible_bookmarks") || "[]");

    // ========== 渲染經文 ==========
    function renderVerses() {
        const key = `${currentBook}_${currentChapter}`;
        const verses = versesData[key];
        if (!verses) {
            document.getElementById("versesContainer").innerHTML = `<div class="error-msg">找不到 ${currentBook} 第 ${currentChapter} 章的經文。</div>`;
            return;
        }
        let html = "";
        const verseNumbers = Object.keys(verses).sort((a, b) => parseInt(a) - parseInt(b));
        for (let v of verseNumbers) {
            let text = verses[v];
            text = text.replace(/神/g, '<span class="strong" data-strong="H430">神</span>');
            text = text.replace(/靈/g, '<span class="strong" data-strong="H7307">靈</span>');
            const isSelected = (currentVerse === parseInt(v));
            html += `<div class="verse-item ${isSelected ? 'selected-verse-highlight' : ''}" data-verse="${v}">
                        <span class="verse-number" data-verse-num="${v}">${v}</span>
                        <div class="verse-text">${text}</div>
                     </div>`;
        }
        document.getElementById("versesContainer").innerHTML = html;
        attachEvents();
        updateProgress();
    }

    function attachEvents() {
        document.querySelectorAll(".strong").forEach(el => {
            el.onclick = (e) => {
                e.stopPropagation();
                const strongId = el.getAttribute("data-strong");
                const dict = { H430: "神，大能者 (אֱלֹהִים)", H7307: "靈，風，氣息 (רוּחַ)" };
                alert("Strong 編號 " + strongId + "\n" + (dict[strongId] || "可詢問 AI 獲得詳細解釋。"));
            };
        });
        document.querySelectorAll(".verse-number").forEach(el => {
            el.onclick = () => {
                currentVerse = parseInt(el.getAttribute("data-verse-num"));
                renderVerses();
                loadNoteForVerse();
            };
        });
    }

    // ========== 筆記與書籤 ==========
    function loadNoteForVerse() {
        const key = `${currentBook} ${currentChapter}:${currentVerse}`;
        document.getElementById("noteContent").value = notes[key] || "";
        document.getElementById("currentVerseRef").innerHTML = key;
    }

    function saveCurrentNote() {
        const key = `${currentBook} ${currentChapter}:${currentVerse}`;
        const content = document.getElementById("noteContent").value;
        if (content.trim()) notes[key] = content;
        else delete notes[key];
        localStorage.setItem("bible_notes", JSON.stringify(notes));
        alert("筆記已儲存");
    }

    function addCurrentBookmark() {
        const ref = `${currentBook} ${currentChapter}:${currentVerse}`;
        if (!bookmarks.includes(ref)) bookmarks.push(ref);
        localStorage.setItem("bible_bookmarks", JSON.stringify(bookmarks));
        refreshBookmarkList();
        alert("已加入書籤");
    }

    function refreshBookmarkList() {
        const div = document.getElementById("bookmarkList");
        if (!div) return;
        div.innerHTML = bookmarks.map(ref => `<div style="margin:6px 0; cursor:pointer;" onclick="jumpToRef('${ref}')">📖 ${ref}</div>`).join("");
        if (bookmarks.length === 0) div.innerHTML = "<div>尚無書籤</div>";
    }

    window.jumpToRef = function(ref) {
        const match = ref.match(/(.+?) (\d+):(\d+)/);
        if (match) {
            currentBook = match[1];
            currentChapter = parseInt(match[2]);
            currentVerse = parseInt(match[3]);
            document.getElementById("bookSelect").value = currentBook;
            document.getElementById("chapterSelect").value = currentChapter;
            updateChapterSelect();
            renderVerses();
            loadNoteForVerse();
        }
    };

    function updateProgress() {
        const last = `${currentBook} ${currentChapter}:${currentVerse}`;
        localStorage.setItem("lastRead", last);
        document.getElementById("progressLabel").innerHTML = `<i class="fas fa-history"></i> 上次：${last}`;
        document.getElementById("progressDetail").innerHTML = `<div>最近閱讀：${last}</div><div>筆記數：${Object.keys(notes).length}</div><div>書籤數：${bookmarks.length}</div>`;
    }

    // ========== 搜尋 ==========
    function searchAll(keyword) {
        if (!keyword.trim()) {
            document.getElementById("searchResult").innerHTML = "";
            return;
        }
        const kw = keyword.toLowerCase();
        const results = [];
        for (let i = 0; i < fullBibleArray.length; i++) {
            const line = fullBibleArray[i];
            if (line.toLowerCase().includes(kw)) {
                results.push(line.substring(0, 90));
                if (results.length >= 40) break;
            }
        }
        const resultDiv = document.getElementById("searchResult");
        if (results.length === 0) resultDiv.innerHTML = "🔍 找不到相關經文。";
        else resultDiv.innerHTML = results.map(r => `<div style="margin:6px 0; background:#f3e9dd; border-radius:20px; padding:8px;">🔍 ${r}</div>`).join("");
    }

    // ========== AI 功能 ==========
    let apiKey = localStorage.getItem("deepseek_key") || "";
    document.getElementById("apiKeyInput").value = apiKey;
    document.getElementById("saveApiKey").onclick = () => {
        localStorage.setItem("deepseek_key", document.getElementById("apiKeyInput").value);
        apiKey = document.getElementById("apiKeyInput").value;
        alert("API Key 已儲存");
    };
    document.getElementById("askAiBtn").onclick = async () => {
        const question = document.getElementById("aiQuestion").value.trim();
        if (!question) return;
        if (!apiKey) {
            alert("請先輸入 DeepSeek API Key（免費申請：platform.deepseek.com）");
            return;
        }
        const chatLog = document.getElementById("aiChatLog");
        chatLog.innerHTML += `<div class="ai-question"><strong>🧑‍💻 你：</strong> ${question}</div>`;
        document.getElementById("aiQuestion").value = "";
        try {
            const res = await fetch("https://api.deepseek.com/v1/chat/completions", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
                body: JSON.stringify({
                    model: "deepseek-v4-pro",
                    messages: [{ role: "user", content: `請用繁體中文回答聖經問題：${question}` }]
                })
            });
            const data = await res.json();
            const answer = data.choices?.[0]?.message?.content || "無回應";
            chatLog.innerHTML += `<div class="ai-answer"><strong>🤖 AI：</strong> ${answer}</div>`;
            chatLog.scrollTop = chatLog.scrollHeight;
        } catch (e) {
            chatLog.innerHTML += `<div class="ai-answer">⚠️ 錯誤：${e.message}</div>`;
        }
    };

    // ========== UI 初始化 ==========
    function updateChapterSelect() {
        const max = chaptersMap[currentBook] || 50;
        const chapSelect = document.getElementById("chapterSelect");
        chapSelect.innerHTML = Array.from({ length: max }, (_, i) => `<option value="${i + 1}">${i + 1}</option>`).join("");
        chapSelect.value = currentChapter;
        const scrollDiv = document.getElementById("chapterScroll");
        scrollDiv.innerHTML = `<div class="chapter-list">${Array.from({ length: max }, (_, i) => `<div class="chap ${i + 1 === currentChapter ? 'active' : ''}" data-chap="${i + 1}">${i + 1}</div>`).join('')}</div>`;
        document.querySelectorAll(".chap").forEach(el => {
            el.onclick = () => {
                currentChapter = parseInt(el.getAttribute("data-chap"));
                document.getElementById("chapterSelect").value = currentChapter;
                renderVerses();
                updateChapterSelect();
            };
        });
    }

    function initUI() {
        if (!parseBibleText()) return;
        const bookSel = document.getElementById("bookSelect");
        bookSel.innerHTML = booksList.map(b => `<option value="${b}">${b}</option>`).join("");
        bookSel.value = currentBook;
        bookSel.onchange = () => {
            currentBook = bookSel.value;
            currentChapter = 1;
            currentVerse = 1;
            updateChapterSelect();
            renderVerses();
            updateProgress();
        };
        const chapSel = document.getElementById("chapterSelect");
        chapSel.onchange = () => {
            currentChapter = parseInt(chapSel.value);
            currentVerse = 1;
            renderVerses();
            updateChapterSelect();
            updateProgress();
        };
        updateChapterSelect();
        renderVerses();
        updateProgress();
    }

    // ========== 事件綁定 ==========
    document.getElementById("openNoteBtn").onclick = () => { document.getElementById("noteDrawer").classList.add("open"); refreshBookmarkList(); loadNoteForVerse(); };
    document.getElementById("openSearchBtn").onclick = () => document.getElementById("searchPanel").classList.toggle("open");
    document.getElementById("openAiBtn").onclick = () => document.getElementById("aiDrawer").classList.add("open");
    document.querySelectorAll(".close-drawer").forEach(btn => btn.onclick = () => document.getElementById(`${btn.dataset.drawer}Drawer`).classList.remove("open"));
    document.getElementById("saveNote").onclick = saveCurrentNote;
    document.getElementById("addBookmark").onclick = addCurrentBookmark;
    document.getElementById("keywordInput").addEventListener("input", (e) => searchAll(e.target.value));

    initUI();
    refreshBookmarkList();
</script>
</body>
</html>
